name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 14 minutes (Render free tier sleeps after 15m of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Check
        run: |
          curl -s -f "https://groupspend-1.onrender.com/api/health" || echo "Ping dispatched"
